name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr review:*)"'
          prompt: |
            이 PR을 리뷰해줘.

            1. conventions/ 폴더의 네이밍 규칙.md, 디렉터리 구조.md, 코드 스타일.md, git 규칙.md 파일을 먼저 읽고 프로젝트 컨벤션을 파악해.
            2. 이번 PR(${{ github.repository }}/pull/${{ github.event.pull_request.number }})에서 변경된 코드를 아래 우선순위로 검토해.

               1순위 - 컨벤션 위반
               - 네이밍(변수/함수/파일/폴더), 디렉터리 구조(app/features/components/lib 역할 분리, route group 규칙), export 방식(named vs default, 마이그레이션 정책 고려), import 방식(상대경로 vs @/ alias 경계), Props 타입(interface 기본), any 금지, 조건문 중괄호, git 규칙(커밋 태그, 브랜치 네이밍) 등 conventions/ 문서에 정의된 규칙 위반을 구체적으로 지적해 (파일명, 라인 포함).
               - export 방식은 마이그레이션 중이라 기존 파일의 export default는 위반으로 지적하지 말고, 새로 추가된 컴포넌트에서만 확인해.

               2순위 - 치명적 문제
               - 버그, 보안 취약점(인증/쿠키 처리, XSS 등), 런타임 에러 가능성, 잘못된 서버/클라이언트 컴포넌트 경계("use client" 오남용) 등.

               3순위 - 개선점
               - UI/UX: 접근성(a11y), 로딩/에러 상태 처리, 사용자 경험 측면에서 개선할 부분.
               - 성능: 불필요한 리렌더링, 번들 크기, TanStack Query 캐싱/무효화 전략, 이미지 최적화 등 성능 최적화 여지.
               - 유지보수성: 재사용성, 가독성, 중복 코드, 테스트 가능성 등 장기적으로 유지보수에 도움이 될 부분.

               4순위 - 잘한 점
               - 이번 PR에서 눈에 띄는 좋은 시도나 패턴이 있으면 짧게라도 짚어줘. 지적만 하지 말고 잘한 부분도 알려줘.

            3. 심각도별로 정리해서 알려줘 (Critical / Warning / Suggestion / Good).
            4. 리뷰 결과를 아래 두 가지 방식으로 모두 남겨줘.
               - 먼저 `gh pr comment ${{ github.event.pull_request.number }} --body "..."` 명령으로 상세 리뷰 내용을 일반 댓글로 남기고,
               - 이어서 Critical 이슈가 있으면 `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "요약"`,
                 없으면 `gh pr review ${{ github.event.pull_request.number }} --comment --body "요약"` 명령으로 정식 리뷰도 제출해줘.
                 (정식 리뷰는 짧은 요약만, 상세 내용은 댓글에)
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
